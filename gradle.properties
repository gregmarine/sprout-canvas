# Java 17 (PLAN.md D4) is selected per-module via `jvmToolchain(17)`, NOT by pinning
# org.gradle.java.home here. A hardcoded JDK path in a committed file breaks every other machine
# that clones the repo; a toolchain lets Gradle locate an installed JDK 17 itself.

org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Required by :canvas-onyx, and by any app that depends on it (PLAN.md §5.7).
#
# The chain is worth writing down, because the error it produces names none of it:
#
#   onyxsdk-pen → onyxsdk-base → pub.devrel:easypermissions:0.2.1
#                              → com.android.support:appcompat-v7:24.2.1 → support-compat:24.2.1
#
# support-compat 24.2.1 and androidx.core both ship `android.support.v4.os.ResultReceiver` and nine
# of its neighbours, so packaging fails with a wall of "Duplicate class android.support.v4.…"
# naming androidx.core and a support library nothing in this repo asked for. Jetifier rewrites the
# old artifact to AndroidX, and the duplicates resolve to one copy.
#
# It applies to the whole build and costs a transform pass over every dependency, which is the
# price of the BOOX ink path. Pruning the tree instead was considered and rejected: the SDK's
# transitive dependencies are load-bearing in ways that only surface as a NoClassDefFoundError on
# a device, and losing the hardware path silently is the failure this project refuses to ship.
android.enableJetifier=true

kotlin.code.style=official

# Maven coordinates (PLAN.md D2, D7). Published to mavenLocal only; the configuration is
# registry-agnostic so a future public publish is a credentials change, not a rewrite.
GROUP=com.symmetricalpalmtree.sprout
VERSION_NAME=0.1.0-SNAPSHOT
