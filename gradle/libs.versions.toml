# Version catalog — the single source of truth for dependency versions.
# See PLAN.md §6: :canvas carries zero required dependencies beyond androidx.annotation.

[versions]
agp = "8.11.1"
kotlin = "2.2.20"

# minSdk 29 is required by the committed-content RenderNode render model (PLAN.md D4, §3.8).
minSdk = "29"
compileSdk = "35"
targetSdk = "35"

androidxAnnotation = "1.9.1"
androidxAppcompat = "1.7.0"

# BOOX (Onyx) SDK — :canvas-onyx only. Served from http://repo.boox.com, never from Maven Central.
# onyxsdk-pen pulls onyxsdk-base, onyxsdk-penbrush and onyxsdk-geometry transitively.
onyxsdkPen = "1.5.4"
onyxsdkDevice = "1.3.3"
# Lets the Onyx SDK reach the hidden framework methods its raw-drawing path is built on. Applied
# process-wide, which is exactly why the host must ask for it — PLAN.md D11.
hiddenApiBypass = "4.3"

junit = "4.13.2"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
espresso = "3.6.1"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }

onyx-sdk-pen = { module = "com.onyx.android.sdk:onyxsdk-pen", version.ref = "onyxsdkPen" }
onyx-sdk-device = { module = "com.onyx.android.sdk:onyxsdk-device", version.ref = "onyxsdkDevice" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenApiBypass" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
